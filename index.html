<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Info Rekonstitusi Obat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f8fa;
    --panel: #ffffff;
    --card: #ffffff;
    --line: #d3e2e8;
    --ink: #14303b;
    --muted: #567784;
    --aqua: #08707f;
    --blue: #2f7fd1;
    --note-bg: #fff6df;
    --note-ink: #7a5200;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-padding-top: 70px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 15.5px/1.6 "Sora", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  :focus-visible { outline: 2px solid var(--aqua); outline-offset: 2px; }
  .app { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }

  /* Sidebar */
  .sidebar {
    position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column;
    background: var(--panel);
    border-right: 1px solid var(--line);
  }
  .brand { padding: 22px 20px 14px; }
  .brand b { display: flex; align-items: center; gap: 10px; font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--aqua); box-shadow: 0 0 0 4px rgba(8,112,127,.18); }
  .brand span { display: block; margin-top: 2px; color: var(--muted); font-size: .85rem; }
  .search-box { padding: 0 20px 12px; }
  .search {
    width: 100%; padding: 12px 14px; font: inherit; font-size: .95rem;
    color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px;
  }
  .search::placeholder { color: #7c98a3; }
  .search:focus { background: #fff; border-color: var(--aqua); box-shadow: 0 0 0 3px rgba(8,112,127,.15); outline: none; }
  .status { margin: 0; padding: 0 20px 8px; color: var(--muted); font-size: .8rem; }
  .nav { flex: 1; overflow-y: auto; padding: 0 10px 12px; }
  .nav h2 { margin: 12px 10px 4px; font-size: .8rem; font-weight: 600; color: var(--aqua); }
  .nav ul { list-style: none; margin: 0; padding: 0; }
  .item {
    display: block; width: 100%; padding: 9px 12px; text-align: left;
    font: inherit; font-size: .92rem; color: var(--ink);
    background: transparent; border: 1px solid transparent; border-radius: 10px; cursor: pointer;
  }
  .item small { display: block; color: var(--muted); font-size: .78rem; }
  .item:hover { background: #eef5f8; }
  .item[aria-current="true"] {
    background: #e3f3f5;
    border-color: rgba(8,112,127,.4);
  }
  .side-foot { padding: 12px 20px; border-top: 1px solid var(--line); font-size: .8rem; }
  .side-foot a { color: var(--muted); }

  /* Konten */
  .main {
    min-width: 0; display: flex; flex-direction: column;
    background: radial-gradient(900px 420px at 85% -80px, rgba(47,127,209,.09), transparent 70%), var(--bg);
  }
  .topbar { display: none; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
  .menu-btn { padding: 8px 12px; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .content { flex: 1; width: 100%; max-width: 860px; padding: 44px 40px; }
  .empty { margin-top: 14vh; color: var(--muted); }
  .empty h1 { margin: 0 0 8px; color: var(--ink); font-size: 2rem; letter-spacing: -0.02em; }
  .empty p { max-width: 46ch; margin: 0 0 8px; }
  kbd { padding: 1px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); font: inherit; font-size: .85rem; }

  h1.name { margin: 0; font-size: 2.3rem; line-height: 1.15; font-weight: 700; letter-spacing: -0.025em; }
  .sub { margin: 6px 0 0; color: var(--muted); }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .copy {
    padding: 9px 14px; font: inherit; font-size: .85rem; color: var(--aqua);
    background: transparent; border: 1px solid rgba(8,112,127,.5); border-radius: 999px; cursor: pointer;
  }
  .copy:hover { background: rgba(8,112,127,.08); }

  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 28px 0 0; }
  .fact { padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px rgba(20,48,59,.06); }
  .fact dt { color: var(--muted); font-size: .8rem; }
  .fact dd { margin: 2px 0 0; font-weight: 600; }

  h2.sec { margin: 36px 0 14px; font-size: 1.1rem; font-weight: 600; }
  .steps { list-style: none; counter-reset: s; margin: 0; padding: 0; position: relative; }
  .steps::before { content: ""; position: absolute; left: 15px; top: 14px; bottom: 14px; width: 2px; background: linear-gradient(var(--aqua), var(--blue)); opacity: .45; }
  .steps li { counter-increment: s; position: relative; padding: 4px 0 18px 52px; max-width: 64ch; }
  .steps li::before {
    content: counter(s); position: absolute; left: 0; top: 0; width: 32px; height: 32px;
    display: grid; place-items: center; font-size: .85rem; font-weight: 700; color: #fff;
    background: var(--aqua); border-radius: 50%; box-shadow: 0 2px 8px rgba(8,112,127,.35);
  }
  .box { padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; max-width: 64ch; }
  .meta { margin: 30px 0 0; color: var(--muted); font-size: .85rem; }

  footer { padding: 0 40px 28px; }
  .note { max-width: 860px; margin: 0; padding: 12px 16px; font-size: .85rem; color: var(--note-ink); background: var(--note-bg); border: 1px solid rgba(122,82,0,.2); border-radius: 12px; }

  .calc { max-width: 64ch; padding: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px rgba(20,48,59,.06); }
  .calc label { display: block; font-weight: 600; font-size: .9rem; }
  .calc input { display: block; width: 100%; margin-top: 6px; padding: 12px 14px; font: inherit; font-size: 1.1rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
  .calc input:focus { background: #fff; border-color: var(--aqua); box-shadow: 0 0 0 3px rgba(8,112,127,.15); outline: none; }
  .calc-conc { margin: 10px 0 0; color: var(--muted); font-size: .85rem; }
  .result { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-height: 84px; margin-top: 14px; padding: 14px 16px; background: #e3f3f5; border-radius: 12px; }
  .result strong { font-size: 2rem; line-height: 1.15; letter-spacing: -0.02em; color: var(--aqua); }
  .calc-hint { color: var(--muted); font-size: .85rem; }
  .calc-note { margin: 12px 0 0; color: var(--muted); font-size: .8rem; }

  .scrim { display: none; }
  @media (max-width: 859px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: fixed; z-index: 20; width: min(330px, 88vw); transform: translateX(-102%); transition: transform .2s; }
    .app.open .sidebar { transform: none; }
    .app.open .scrim { display: block; position: fixed; inset: 0; z-index: 15; background: rgba(20,48,59,.4); }
    .topbar { display: flex; }
    .content { padding: 28px 18px; }
    footer { padding: 0 18px 24px; }
    h1.name { font-size: 1.8rem; }
  }
  @media (prefers-reduced-motion: reduce) { .sidebar { transition: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Daftar obat">
    <div class="brand"><b><i class="dot"></i>Rekonstitusi</b><span>Informasi cara rekonstitusi obat</span></div>
    <div class="search-box">
      <input id="search" class="search" type="search" placeholder="Cari nama obat  ( / )" autocomplete="off" aria-label="Cari nama obat">
    </div>
    <p class="status" id="status" aria-live="polite">Memuat data…</p>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><a href="admin.html">Masuk petugas</a></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Buka daftar obat">Daftar obat</button>
    </div>
    <article class="content" id="detail" aria-live="polite"></article>
    <footer>
      <p class="note">Informasi ini bersifat pendukung dan tidak menggantikan brosur produk atau penilaian tenaga kesehatan. Selalu verifikasi dengan brosur resmi sebelum menyiapkan obat.</p>
    </footer>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://iyyuailarfxwuwiffsfq.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5eXVhaWxhcmZ4d3V3aWZmc2ZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNjk3ODYsImV4cCI6MjEwODY0NTc4Nn0.O4b9uUzjMFj0E4JoewrMd_0VYD7kkPZNPVCLbQLx6Gc";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = function (id) { return document.getElementById(id); };
  let all = [];
  let selectedId = null;

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function closeMenu() { $("app").classList.remove("open"); }

  async function load() {
    const { data, error } = await db.from("obat").select("*").order("nama_obat", { ascending: true }).limit(1000);
    if (error) { $("status").textContent = "Data tidak dapat dimuat. Periksa koneksi internet."; showEmpty(); return; }
    all = data;
    renderNav();
    showFromHash();
  }

  function renderNav() {
    const q = $("search").value.trim().toLowerCase();
    const list = all.filter(function (r) { return !q || r.nama_obat.toLowerCase().includes(q); });
    const nav = $("nav");
    nav.replaceChildren();
    $("status").textContent = list.length ? list.length + " obat" + (q ? " ditemukan" : "") : (q ? "Obat tidak ditemukan. Coba ejaan lain." : "Belum ada data obat.");
    let letter = "", ul = null;
    list.forEach(function (r) {
      const first = r.nama_obat.trim().charAt(0).toUpperCase() || "#";
      if (first !== letter) {
        letter = first;
        nav.append(el("h2", null, letter));
        ul = document.createElement("ul");
        nav.append(ul);
      }
      const li = document.createElement("li");
      const b = el("button", "item", r.nama_obat);
      b.type = "button";
      if (r.bentuk_sediaan) b.append(el("small", null, r.bentuk_sediaan));
      if (r.id === selectedId) b.setAttribute("aria-current", "true");
      b.addEventListener("click", function () { location.hash = String(r.id); closeMenu(); });
      li.append(b);
      ul.append(li);
    });
  }

  function showEmpty(msg) {
    const d = $("detail");
    d.replaceChildren();
    const box = el("div", "empty");
    box.append(el("h1", null, "Pilih obat"));
    box.append(el("p", null, msg || "Pilih nama obat di daftar sebelah kiri untuk melihat cara rekonstitusinya."));
    const p = el("p", null, "Tekan ");
    p.append(el("kbd", null, "/"), document.createTextNode(" untuk langsung mencari."));
    box.append(p);
    d.append(box);
  }

  function stepsOf(r) {
    return String(r.cara_rekonstitusi || "").split(/\r?\n/)
      .map(function (s) { return s.trim().replace(/^\d+[.)]\s*/, ""); }).filter(Boolean);
  }

  function renderDetail(r) {
    const d = $("detail");
    d.replaceChildren();
    const head = el("div", "head");
    const t = document.createElement("div");
    t.append(el("h1", "name", r.nama_obat));
    if (r.bentuk_sediaan) t.append(el("p", "sub", r.bentuk_sediaan));
    head.append(t);
    const steps = stepsOf(r);
    const copy = el("button", "copy", "Salin langkah");
    copy.type = "button";
    copy.addEventListener("click", function () {
      const text = r.nama_obat + "\n" + steps.map(function (s, i) { return (i + 1) + ". " + s; }).join("\n");
      navigator.clipboard.writeText(text).then(function () {
        copy.textContent = "Tersalin";
        setTimeout(function () { copy.textContent = "Salin langkah"; }, 1500);
      });
    });
    head.append(copy);
    d.append(head);

    const facts = [["Pelarut", r.pelarut], ["Volume pelarut", r.volume_pelarut], ["Konsentrasi akhir", r.konsentrasi_akhir]]
      .filter(function (f) { return f[1]; });
    if (facts.length) {
      const dl = el("dl", "facts");
      facts.forEach(function (f) {
        const c = el("div", "fact");
        c.append(el("dt", null, f[0]), el("dd", null, f[1]));
        dl.append(c);
      });
      d.append(dl);
    }
    if (steps.length) {
      d.append(el("h2", "sec", "Cara rekonstitusi"));
      const ol = el("ol", "steps");
      steps.forEach(function (s) { ol.append(el("li", null, s)); });
      d.append(ol);
    }
    if (Number(r.konsentrasi_per_ml) > 0) renderCalc(d, r);
    if (r.stabilitas) {
      d.append(el("h2", "sec", "Stabilitas"), el("div", "box", r.stabilitas));
    }
    const meta = [];
    if (r.sumber) meta.push("Sumber: " + r.sumber);
    if (r.updated_at) meta.push("Diperbarui: " + new Date(r.updated_at).toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" }));
    if (meta.length) d.append(el("p", "meta", meta.join(". ")));
  }

  function fmt(n, max) { return n.toLocaleString("id-ID", { maximumFractionDigits: max }); }

  function renderCalc(d, r) {
    const unit = r.satuan_dosis || "mg";
    const conc = Number(r.konsentrasi_per_ml);
    d.append(el("h2", "sec", "Kalkulator volume"));
    const box = el("div", "calc");
    const label = el("label", null, "Dosis (" + unit + ")");
    const input = el("input");
    input.type = "text";
    input.inputMode = "decimal";
    input.autocomplete = "off";
    input.placeholder = "mis. 250";
    label.append(input);
    const out = el("div", "result");
    out.setAttribute("role", "status");
    box.append(label, el("p", "calc-conc", "Konsentrasi: " + fmt(conc, 4) + " " + unit + "/mL"), out,
      el("p", "calc-note", "Memakai konsentrasi hasil rekonstitusi sesuai langkah di atas. Periksa kembali hasil hitungan sebelum menyiapkan obat."));

    function update() {
      const raw = input.value.trim().replace(",", ".");
      out.replaceChildren();
      if (!raw) { out.append(el("span", "calc-hint", "Isi dosis untuk melihat volume yang diambil.")); return; }
      if (!/^(\d+\.?\d*|\.\d+)$/.test(raw) || Number(raw) <= 0) {
        out.append(el("span", "calc-hint", "Masukkan angka dosis lebih dari 0."));
        return;
      }
      const dose = Number(raw);
      const vol = dose / conc;
      const v = fmt(vol, vol < 1 ? 3 : 2);
      out.append(el("span", "calc-hint", "Volume yang diambil"),
        el("strong", null, v + " mL"),
        el("span", "calc-hint", fmt(dose, 4) + " " + unit + " ÷ " + fmt(conc, 4) + " " + unit + "/mL = " + v + " mL"));
    }
    input.addEventListener("input", update);
    update();
    d.append(box);
  }

  function showFromHash() {
    const id = Number(location.hash.slice(1));
    const rec = id && all.find(function (r) { return r.id === id; });
    selectedId = rec ? rec.id : null;
    if (rec) { renderDetail(rec); window.scrollTo(0, 0); }
    else showEmpty(id ? "Data obat tidak ditemukan." : null);
    renderNav();
  }

  $("search").addEventListener("input", renderNav);
  $("menuBtn").addEventListener("click", function () { $("app").classList.add("open"); });
  $("scrim").addEventListener("click", closeMenu);
  window.addEventListener("hashchange", showFromHash);
  document.addEventListener("keydown", function (e) {
    const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (e.key === "/" && !typing) { e.preventDefault(); $("app").classList.add("open"); $("search").focus(); }
    if (e.key === "Escape") closeMenu();
  });

  showEmpty();
  load();
</script>
</body>
</html>
